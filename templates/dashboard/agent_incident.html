{% extends "base_agent.html" %}
{% block title %}CLEAN - Dashboard Agent{% endblock %}
{% block content %}
<header class="flex items-center gap-4 mb-8 pt-4">
    <a href="{% url 'dashboard:agent' %}" class="p-2 bg-white rounded-full shadow-sm text-slate-600">
        <i data-lucide="arrow-left"></i>
    </a>
    <h1 class="text-2xl font-bold text-slate-900">Signaler un incident</h1>
</header>

<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-6">
    <form method="post" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}

        <!-- Type d'incident -->
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">Type d'incident</label>
            {{ form.type_incident }}
        </div>

        <!-- Client concerné -->
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">Client concerné</label>
            {{ form.client }}
        </div>


        <!-- Description -->
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">Description</label>
            {{ form.description }}
        </div>

        <!-- Photo -->
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">Photo (optionnel)</label>
            {{ form.photo }}
        </div>

        <button type="submit" class="w-full py-4 bg-amber-600 text-white rounded-xl font-bold shadow-lg shadow-amber-200 flex items-center justify-center gap-2">
            <i data-lucide="send" class="w-5 h-5"></i> ENVOYER LE RAPPORT
        </button>
    </form>
</div>

{% endblock %}
