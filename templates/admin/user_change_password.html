{% extends "base_admin.html" %}
{% block title %}Changer mot de passe{% endblock %}
{% block header %}Changer le mot de passe{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto bg-white shadow-xl rounded-2xl p-8">

    <h2 class="text-xl font-semibold text-gray-700 mb-6">
        Modifier le mot de passe de {{ user.username }}
    </h2>

    <form method="POST" class="space-y-6">
        {% csrf_token %}

        <!-- Champ mot de passe 1 -->
        <div>
            <label class="block text-sm font-medium text-gray-600 mb-2">Nouveau mot de passe</label>

            <div class="relative">
                <span class="absolute inset-y-0 left-3 flex items-center text-gray-400 text-lg">
                    🔒
                </span>

                <input type="password" name="password1" id="password1"
                       class="w-full h-14 pl-12 pr-12 rounded-lg border border-gray-300
                              focus:ring-emerald-500 focus:border-emerald-500 transition"
                       placeholder="Entrez le nouveau mot de passe" required>

                <button type="button"
                        onclick="togglePassword('password1')"
                        class="absolute inset-y-0 right-3 flex items-center text-gray-500 hover:text-gray-700">
                    👁️
                </button>
            </div>
        </div>

        <!-- Champ mot de passe 2 -->
        <div>
            <label class="block text-sm font-medium text-gray-600 mb-2">Confirmez le mot de passe</label>

            <div class="relative">
                <span class="absolute inset-y-0 left-3 flex items-center text-gray-400 text-lg">
                    🔒
                </span>

                <input type="password" name="password2" id="password2"
                       class="w-full h-14 pl-12 pr-12 rounded-lg border border-gray-300
                              focus:ring-emerald-500 focus:border-emerald-500 transition"
                       placeholder="Confirmez le mot de passe" required>

                <button type="button"
                        onclick="togglePassword('password2')"
                        class="absolute inset-y-0 right-3 flex items-center text-gray-500 hover:text-gray-700">
                    👁️
                </button>
            </div>
        </div>

        <button type="submit"
                class="w-full py-3 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition">
            Modifier le mot de passe
        </button>

    </form>

</div>

<!-- Script afficher/masquer -->
<script>
function togglePassword(id) {
    const field = document.getElementById(id);
    field.type = field.type === "password" ? "text" : "password";
}
</script>

{% endblock %}
