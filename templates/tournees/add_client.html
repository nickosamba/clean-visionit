{% extends "base_dashboard.html" %}

{% block title %}Ajouter un client à la tournée — CLEAN{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto p-6">

    <h1 class="text-2xl font-bold text-emerald-600 mb-6">
        Ajouter un client à la tournée {{ tournee.id }}
    </h1>

    <form method="POST" class="space-y-5 bg-white p-6 rounded-lg shadow">
        {% csrf_token %}

        <!-- Client -->
        <div>
            <label class="font-semibold">Client</label>
            <select name="client" 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg 
                           focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" required>
                <option value="">-- Choisir un client --</option>
                {% for c in clients %}
                    <option value="{{ c.id }}">{{ c.code_client }} - {{ c.nom }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Statut service -->
        <!-- Statut service -->
        <div>
            <label class="font-semibold">Statut du service</label>
            <select name="statut_service" 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg 
                        focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
                {% for key, value in statut_choices %}
                    <option value="{{ key }}">{{ value }}</option>
                {% endfor %}
            </select>
        </div>


        <!-- Commentaires -->
        <div>
            <label class="font-semibold">Commentaires de l’agent</label>
            <textarea name="commentaires_agent" rows="3"
                      class="w-full px-4 py-2 border border-slate-300 rounded-lg 
                             focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
                      placeholder="Notes ou remarques éventuelles..."></textarea>
        </div>

        <!-- Bouton -->
        <button class="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition">
            Ajouter le client
        </button>
    </form>

</div>
{% endblock %}
