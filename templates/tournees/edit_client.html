{% extends "base_dashboard.html" %}

{% block title %}Modifier le client de la tournée — CLEAN{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto p-6">

    <h1 class="text-2xl font-bold text-emerald-600 mb-6">
        Modifier le client {{ tc.client.code_client }} — Tournée {{ tc.tournee.id }}
    </h1>

    <form method="POST" class="space-y-5 bg-white p-6 rounded-lg shadow">
        {% csrf_token %}

        <!-- Statut service -->
        <div>
            <label class="font-semibold">Statut du service</label>
            <select name="statut_service" 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg 
                           focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
                {% for key, value in tc.StatutService.choices %}
                    <option value="{{ key }}" {% if tc.statut_service == key %}selected{% endif %}>
                        {{ value }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Commentaires -->
        <div>
            <label class="font-semibold">Commentaires de l’agent</label>
            <textarea name="commentaires_agent" rows="3"
                      class="w-full px-4 py-2 border border-slate-300 rounded-lg 
                             focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
                      placeholder="Notes ou remarques éventuelles...">{{ tc.commentaires_agent }}</textarea>
        </div>

        <!-- Bouton -->
        <button class="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition">
            Mettre à jour
        </button>
    </form>

</div>
{% endblock %}
