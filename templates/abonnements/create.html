{% extends "base_dashboard.html" %}

{% block title %}Créer un abonnement — CLEAN{% endblock %}

{% block content %}

<div class="max-w-2xl mx-auto p-6">

    <h1 class="text-2xl font-bold text-emerald-600 mb-6">Créer un abonnement</h1>

    <form method="POST" class="space-y-5 bg-white p-6 rounded-lg shadow">
        {% csrf_token %}

        <div>
            <label class="font-semibold">Nom</label>
            <input type="text" name="nom" class="w-full p-2 border rounded-lg" required>
        </div>

        <div>
            <label class="font-semibold">Montant de base</label>
            <input type="number" step="0.01" name="montant_base" class="w-full p-2 border rounded-lg" required>
        </div>

        <div>
            <label class="font-semibold">Description</label>
            <textarea name="description" class="w-full p-2 border rounded-lg"></textarea>
        </div>

        <div>
            <label class="font-semibold">Avantages</label>
            <textarea name="avantages" class="w-full p-2 border rounded-lg"></textarea>
        </div>

        <button class="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition">
            Enregistrer
        </button>
    </form>

</div>

{% endblock %}
