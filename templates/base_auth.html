{% load static %}
<!DOCTYPE html>
<html class="{% if theme == 'dark' %}dark{% else %}light{% endif %}" lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}CLEAN{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'css/form_styles.css' %}">
  <script src="{% static 'js/password_validation.js' %}"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#13ec5b",
            "background-light": "#f6f8f6",
            "background-dark": "#102216",
            "content-light": "#ffffff",
            "content-dark": "#182c1e",
            "text-light": "#111813",
            "text-dark": "#e1e8e3",
            "text-secondary-light": "#61896f",
            "text-secondary-dark": "#9cb4a4",
            "border-light": "#dbe6df",
            "border-dark": "#314b3a",
            "error": "#dc3545",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 24px;
    }
  </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark">
  <div class="relative flex min-h-screen w-full flex-col items-center justify-center p-4 group/design-root">
    <div class="flex w-full max-w-md flex-col items-center justify-center">

      <!-- Logo -->
      <div class="mb-8 flex items-center gap-3">
        <!-- <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-primary">
          <span class="material-symbols-outlined text-text-light dark:text-text-dark" style="font-size: 32px;">cleaning_services</span>
        </div> -->
        <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center text-white font-bold text-lg shadow-md">C</div>
        <h1 class="text-3xl font-bold tracking-tighter text-text-light dark:text-text-dark">CLEAN</h1>
      </div>

      <!-- Container principal -->
      <div class="w-full rounded-xl border border-border-light bg-content-light p-6 shadow-sm dark:border-border-dark dark:bg-content-dark sm:p-8">
        
        {% block content %}
        <!-- Ici viendra le contenu spécifique -->
        {% endblock %}

      </div>
    </div>
  </div>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize dark mode based on preference from localStorage
      const currentTheme = localStorage.getItem('theme') || 'light';
      if (currentTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      
      // Dark mode toggle
      const darkModeToggle = document.createElement('button');
      darkModeToggle.className = 'fixed bottom-4 right-4 p-3 bg-content-light dark:bg-content-dark rounded-full border border-border-light dark:border-border-dark shadow-lg z-50';
      darkModeToggle.innerHTML = currentTheme === 'dark' ?
          '<span class="material-symbols-outlined text-text-light dark:text-text-dark">light_mode</span>' :
          '<span class="material-symbols-outlined text-text-light dark:text-text-dark">dark_mode</span>';
      document.body.appendChild(darkModeToggle);
      
      darkModeToggle.addEventListener('click', function() {
        document.documentElement.classList.toggle('dark');
        const isDarkMode = document.documentElement.classList.contains('dark');
        
        // Update button icon and save theme
        this.innerHTML = isDarkMode ? 
            '<span class="material-symbols-outlined text-text-light dark:text-text-dark">light_mode</span>' : 
            '<span class="material-symbols-outlined text-text-light dark:text-text-dark">dark_mode</span>';
        
        // Save theme preference
        localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
      });
    });
  </script>
</body>
</html>
