{% extends "base_comptable.html" %}
{% block title %}Paiement - CLEAN Comptabilité{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-6">Paiement de l'Échéance</h1>

<div class="bg-white rounded-xl shadow-lg p-6 max-w-lg mx-auto">
  <p class="mb-6 text-slate-600">
    <span class="block">👤 Client : <strong>{{ echeance.client.nom }}</strong></span>
    <span class="block">💰 Montant dû : <strong>{{ echeance.montant_du }} FCFA</strong></span>
    <span class="block">📅 Période : <strong>{{ echeance.periode }}</strong></span>
  </p>

  <form method="post" class="space-y-6">
    {% csrf_token %}

    <!-- Montant payé -->
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Montant payé</label>
      <input type="number" name="montant_paye" step="0.01" required
             class="w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600">
    </div>

    <!-- Mode de paiement -->
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Mode de paiement</label>
      <select name="mode_paiement" required
              class="w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600">
        {% for value, label in modes %}
          <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>

    <!-- Bouton valider -->
    <div class="flex justify-end">
      <button type="submit"
              class="px-5 py-2 bg-emerald-600 text-white font-semibold rounded-lg shadow hover:bg-emerald-700 transition">
        💳 Valider le paiement
      </button>
    </div>
  </form>
</div>
{% endblock %}
